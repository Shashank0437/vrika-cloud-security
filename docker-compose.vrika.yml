# Vrika POC overlay — Prowler on host :8090 (all interfaces for Docker bridge access)
# Public UI via host nginx https://…/prowler/
services:
  nginx:
    image: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: vrika-prowler-nginx
    restart: unless-stopped
    ports:
      # Bind all interfaces so vrika-server-api (Docker) can reach via host.docker.internal:8090
      - "8090:80"
    volumes:
      - ./contrib/reverse-proxy/nginx.vrika.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_BASE_PATH: /prowler
        NEXT_PUBLIC_VRIKA_EMBED_MODE: "true"
        NEXT_PUBLIC_PROWLER_RELEASE_VERSION: ${NEXT_PUBLIC_PROWLER_RELEASE_VERSION:-v5.34.0}
    image: vrika-prowler-ui:local
    restart: unless-stopped
    ports: !reset []
    environment:
      VRIKA_LLM_API_KEY: ${VRIKA_LLM_API_KEY:-}
      VRIKA_LLM_URL: ${VRIKA_LLM_URL:-}
      VRIKA_LLM_MODEL: ${VRIKA_LLM_MODEL:-}
      VRIKA_LLM_PROVIDER: ${VRIKA_LLM_PROVIDER:-}
      API_BASE_URL: http://prowler-api:8080/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/prowler/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  worker:
    # Pin the Vrika-customised image so the deploy never falls back to the
    # vanilla upstream :stable tag (which lacks the Vrika PDF/branding code).
    image: prowlercloud/prowler-api:local
    restart: unless-stopped
    environment:
      VRIKA_PDF_BRANDING: "true"
      # Central config store (org custom logo / SMTP) internal API. Baked here
      # so a .env reset cannot silently disable custom report logos. The shared
      # secret is resolved by the config client from VRIKA_BRIDGE_SECRET (.env),
      # so it is intentionally not duplicated in this version-controlled file.
      VRIKA_SERVER_INTERNAL_URL: "http://vrika-server-api:8000"

  worker-beat:
    image: prowlercloud/prowler-api:local
    restart: unless-stopped

  api:
    image: prowlercloud/prowler-api:local
    restart: unless-stopped
    ports: !reset []
    environment:
      VRIKA_PDF_BRANDING: "true"
      VRIKA_SERVER_INTERNAL_URL: "http://vrika-server-api:8000"
      # Always allow the in-network proxy hostnames the stack/host nginx use to
      # reach Django, regardless of what the base .env provides. Without these
      # the API returns HTTP 400 (DisallowedHost) and the UI shows "server
      # unavailable". The public host/IP still comes from the base .env value.
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api},prowler-api,ui,10.239.37.110"
    # Z800 cold start: migrations + Gunicorn + compliance cache warm-up can exceed 3 min.
    healthcheck:
      start_period: 180s
      interval: 15s
      timeout: 10s
      retries: 16

  mcp-server:
    restart: unless-stopped
    ports: !reset []

  postgres:
    restart: unless-stopped
    ports: !reset []

  valkey:
    restart: unless-stopped
    ports: !reset []

  neo4j:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      start_period: 180s
      interval: 15s
      timeout: 15s
      retries: 20

# Reuse the pre-existing shared network so prowler services and the vrika-server
# stack can reach each other by container name. The network must already exist
# (created for the vrika-server <-> prowler bridge); on a fresh host create it
# once with: docker network create vrika-cloud-security_default
networks:
  default:
    external: true
    name: vrika-cloud-security_default
